<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Movie Library</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="config.js"></script>
  <style>
    body { background: #0f1115; }
    .poster { aspect-ratio: 2 / 3; }
    /* Desktop filter dropdowns: solid dark fields with readable option lists, and a clear
       highlight on any filter that is not at its default. Phones keep their native look. */
    @media (min-width: 640px) {
      #filters select {
        background: #1d2230; color: #f3f4f6; border: 1px solid #3b4252;
        color-scheme: dark; cursor: pointer;
      }
      #filters select:hover { border-color: #7b8494; }
      #filters select:focus { outline: none; border-color: #e5e7eb; box-shadow: 0 0 0 1px #e5e7eb; }
      #filters select option { background: #1d2230; color: #f3f4f6; }
      #filters select.is-set { background: #f59e0b; color: #111827; border-color: #fbbf24; font-weight: 600; }
    }
  </style>
</head>
<body class="text-gray-100 font-sans">
  <header class="sticky top-0 z-10 bg-[#0f1115]/95 backdrop-blur border-b border-white/10">
    <div class="max-w-7xl mx-auto px-4 py-2 sm:py-3 flex flex-wrap gap-2 items-center">
      <h1 class="text-lg font-semibold mr-auto">🎬 Movie Library</h1>
      <button id="requestsBtn" class="hidden text-sm text-gray-400 underline hover:text-gray-200" onclick="openRequests()">Requests</button>
      <button id="householdBtn" class="hidden text-sm text-gray-400 underline hover:text-gray-200" onclick="openHousehold()">Household</button>
      <span id="who" class="text-sm text-gray-400"></span>
      <div id="signin" class="hidden"></div>
    </div>
    <div id="filters" class="max-w-7xl mx-auto px-4 pb-2 sm:pb-3 grid grid-cols-4 gap-1.5 sm:flex sm:flex-wrap sm:gap-2 text-xs sm:text-sm">
      <input id="q" placeholder="Search title, cast, director…" class="col-span-4 sm:flex-1 sm:min-w-[12rem] bg-white/5 rounded px-3 py-1.5 sm:py-2 outline-none focus:ring-1 ring-white/30">
      <select id="fOwner" class="min-w-0 bg-white/5 rounded px-1 sm:px-2 py-1.5 sm:py-2"><option value="">All owners</option></select>
      <select id="fStatus" class="min-w-0 bg-white/5 rounded px-1 sm:px-2 py-1.5 sm:py-2">
        <option value="">Any status</option><option value="home">At owner</option><option value="out">Lent out</option><option value="mine">My shelf</option><option value="requested">Requested</option>
      </select>
      <select id="fFormat" class="min-w-0 bg-white/5 rounded px-1 sm:px-2 py-1.5 sm:py-2">
        <option value="">All formats</option><option>HD Blu Ray</option><option>4k Blu Ray</option><option>3D Blu Ray</option>
      </select>
      <select id="fType" class="min-w-0 bg-white/5 rounded px-1 sm:px-2 py-1.5 sm:py-2">
        <option value="">All types</option><option>Film</option><option>Film collection</option><option value="TV">TV</option>
      </select>
      <select id="fSeen" class="col-span-4 min-w-0 bg-white/5 rounded px-1 sm:px-2 py-1.5 sm:py-2"><option value="">Seen or not</option></select>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-2 sm:py-4">
    <p id="status" class="text-gray-400 text-xs sm:text-sm mb-2 sm:mb-3">Loading library…</p>
    <p id="notice" class="hidden fixed bottom-4 left-4 right-4 sm:left-auto sm:max-w-sm z-30 bg-amber-500 text-black text-sm rounded-lg px-4 py-3 shadow-lg"></p>
    <div id="grid" class="grid grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-2 sm:gap-4"></div>
  </main>

  <div id="modal" class="fixed inset-0 z-20 hidden bg-black/70 overflow-y-auto" onclick="if (event.target === this) closeModal()">
    <div id="detail" class="max-w-3xl mx-auto my-6 mx-4 sm:mx-auto bg-[#171a21] rounded-xl overflow-hidden"></div>
  </div>

  <footer class="max-w-7xl mx-auto px-4 py-6 text-xs text-gray-500">
    Movie data and images from <a class="underline" href="https://www.themoviedb.org" target="_blank">TMDB</a>.
    This product uses the TMDB API but is not endorsed or certified by TMDB.
  </footer>

<script>
var IMG = 'https://image.tmdb.org/t/p/';
var STORE_KEY = 'movie-library:v1';
var TOKEN_KEY = 'movie-library:token';
var CONFIG = window.MOVIE_LIBRARY_CONFIG || {};
var state = { data: null, groups: [] };
var auth = { token: null, exp: 0, waiting: [], gis: false };

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

// ---------- Sign-in ----------
// Google Identity Services gives the page an ID token (valid for an hour), which is sent with every request.
// The Apps Script API checks it and only answers people the sheet is shared with.

function initSignIn() {
  google.accounts.id.initialize({
    client_id: CONFIG.clientId,
    callback: signedIn,
    auto_select: true,
    cancel_on_tap_outside: false,
    use_fedcm_for_prompt: true
  });
  google.accounts.id.renderButton(document.getElementById('signin'), { theme: 'filled_black', size: 'medium', shape: 'pill', text: 'signin' });
  auth.gis = true;
  if (auth.waiting.length) google.accounts.id.prompt();
}

function signedIn(resp) {
  auth.token = resp.credential;
  auth.exp = jwtPayload(resp.credential).exp;
  try { localStorage.setItem(TOKEN_KEY, JSON.stringify({ token: auth.token, exp: auth.exp })); } catch (e) {}
  document.getElementById('signin').classList.add('hidden');
  var waiting = auth.waiting;
  auth.waiting = [];
  waiting.forEach(function (resolve) { resolve(auth.token); });
}

function jwtPayload(jwt) {
  var b64 = jwt.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
  return JSON.parse(decodeURIComponent(escape(atob(b64))));
}

function tokenValid() {
  return auth.token && auth.exp * 1000 > Date.now() + 60000;
}

// Resolves with a fresh token, asking Google for one (silently when possible) if needed.
function getToken() {
  if (tokenValid()) return Promise.resolve(auth.token);
  forgetToken();
  return new Promise(function (resolve) {
    auth.waiting.push(resolve);
    if (auth.waiting.length > 1) return;
    document.getElementById('signin').classList.remove('hidden');
    if (!state.data) document.getElementById('status').textContent = 'Sign in with your Google account to see the library.';
    if (auth.gis) google.accounts.id.prompt();
  });
}

function forgetToken() {
  auth.token = null;
  try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
}

function signOut() {
  forgetToken();
  try { localStorage.removeItem(STORE_KEY); } catch (e) {}
  if (auth.gis) google.accounts.id.disableAutoSelect();
  location.reload();
}

// Every call is a POST with a plain-text JSON body, so the browser sends it without a CORS preflight.
function api(action, params, retried) {
  if (!CONFIG.apiUrl || !/^https:/.test(CONFIG.apiUrl)) return Promise.reject(new Error('Set apiUrl in config.js to the Apps Script /exec URL.'));
  return getToken().then(function (token) {
    var body = Object.assign({ action: action, token: token }, params || {});
    return fetch(CONFIG.apiUrl, { method: 'POST', body: JSON.stringify(body) });
  }).then(function (res) {
    if (!res.ok) throw new Error('The server answered ' + res.status + '. Please try again.');
    return res.json();
  }).then(function (res) {
    if (res.ok) return res.data;
    if (res.code === 'signin' && !retried) {
      forgetToken();
      return api(action, params, true);
    }
    var err = new Error(res.error);
    err.code = res.code;
    throw err;
  });
}

// ---------- Data ----------

// This browser's last copy is shown at once while the sheet is asked again; lending always checks the sheet first.
function load() {
  try {
    var t = JSON.parse(localStorage.getItem(TOKEN_KEY));
    if (t) { auth.token = t.token; auth.exp = t.exp; }
  } catch (e) {}
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem(STORE_KEY)); } catch (e) {}
  if (saved) render(saved, true);
  refresh();
}

function refresh() {
  api('library').then(fresh, fail);
}

function fresh(data) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch (e) {}
  render(data, false);
}

function fail(err) {
  var status = document.getElementById('status');
  status.textContent = 'Error: ' + (err && err.message || err);
  if (err && err.code === 'denied') {
    status.insertAdjacentHTML('beforeend', ' <button class="underline" onclick="signOut()">Use another account</button>');
    document.getElementById('grid').innerHTML = '';
  }
}

// A lend or return can fail because the disc moved since the page loaded; show the error, then reload the data.
function changeFailed(err) {
  alertBox(err && err.message || err);
  refresh();
}

function alertBox(msg) {
  var box = document.getElementById('notice');
  box.textContent = msg;
  box.classList.remove('hidden');
  setTimeout(function () { box.classList.add('hidden'); }, 6000);
}

function render(data, stale) {
  state.data = data;
  state.stale = !!stale;
  document.getElementById('who').innerHTML = 'Signed in as ' + esc(data.user.name) +
    ' · <button class="underline hover:text-gray-200" onclick="signOut()">Sign out</button>';
  var owners = {};
  data.discs.forEach(function (d) { owners[d.owner] = true; });
  var sel = document.getElementById('fOwner');
  var current = sel.value;
  sel.innerHTML = '<option value="">All owners</option>' + Object.keys(owners).sort().map(function (o) {
    return '<option>' + esc(o) + '</option>';
  }).join('');
  sel.value = current;
  var seenSel = document.getElementById('fSeen');
  var seenCurrent = seenSel.value;
  seenSel.innerHTML = '<option value="">Seen or not</option>' + viewers().map(function (p) {
    return '<option value="not:' + esc(p) + '">Not seen by ' + esc(p) + '</option><option value="by:' + esc(p) + '">Seen by ' + esc(p) + '</option>';
  }).join('');
  seenSel.value = seenCurrent;
  if (seenSel.value !== seenCurrent) seenSel.value = '';
  document.getElementById('householdBtn').classList.remove('hidden');
  var askedOfMe = requestList().toMe.length;
  var reqBtn = document.getElementById('requestsBtn');
  reqBtn.innerHTML = 'Requests' + (askedOfMe ? ' <span class="inline-block bg-sky-500 text-black rounded-full px-1.5 text-xs font-semibold">' + askedOfMe + '</span>' : '');
  reqBtn.classList.remove('hidden');
  markSetFilters();

  // One card per movie: discs matched to the same single TMDB movie are grouped together.
  // TV discs always get their own card, since seasons of one show share a TMDB id.
  var map = {};
  state.groups = [];
  data.discs.forEach(function (d) {
    var items = d.meta && d.meta.items || [];
    var k = items.length === 1 && items[0].kind === 'movie' ? 'movie:' + items[0].tmdbId : 'disc:' + d.key;
    if (!map[k]) { map[k] = { key: k, discs: [], items: items }; state.groups.push(map[k]); }
    map[k].discs.push(d);
  });
  state.groups.sort(function (a, b) { return sortTitle(a.discs[0].title).localeCompare(sortTitle(b.discs[0].title)); });
  applyFilters();
  if (state.openKey === HOUSEHOLD) openHousehold();
  else if (state.openKey === REQUESTS) openRequests();
  else if (state.openKey) openGroup(state.openKey);
}

// "The Matrix" sorts under M.
function sortTitle(t) {
  return t.replace(/^(the|a|an)\s+/i, '');
}

function matches(g) {
  var q = document.getElementById('q').value.trim().toLowerCase();
  var owner = document.getElementById('fOwner').value;
  var status = document.getElementById('fStatus').value;
  var format = document.getElementById('fFormat').value;
  var type = document.getElementById('fType').value;
  var me = state.data.user.name;
  var discs = g.discs.filter(function (d) {
    if (owner && d.owner !== owner) return false;
    if (status === 'home' && d.where !== d.owner) return false;
    if (status === 'out' && d.where === d.owner) return false;
    if (status === 'mine' && d.owner !== me && d.where !== me) return false;
    if (status === 'requested' && !(d.requests || []).length) return false;
    if (format && d.formats.indexOf(format) < 0) return false;
    if (type && (type === 'TV' ? d.type.indexOf('TV') !== 0 : d.type !== type)) return false;
    return true;
  });
  if (!discs.length) return false;
  var seen = document.getElementById('fSeen').value;
  if (seen) {
    var person = seen.slice(seen.indexOf(':') + 1);
    if (groupSeenBy(g, person) !== (seen.indexOf('by:') === 0)) return false;
  }
  if (!q) return true;
  var hay = [g.discs[0].title, g.discs[0].notes].concat(g.items.map(function (i) {
    return [i.title, (i.cast || []).join(' '), (i.directors || []).join(' '), (i.genres || []).join(' ')].join(' ');
  })).join(' ').toLowerCase();
  return hay.indexOf(q) >= 0;
}

// Highlights dropdowns that are set to something other than their first ("All …") option.
function markSetFilters() {
  ['fOwner', 'fStatus', 'fFormat', 'fType', 'fSeen'].forEach(function (id) {
    var el = document.getElementById(id);
    el.classList.toggle('is-set', el.value !== '');
  });
}

function applyFilters() {
  var shown = state.groups.filter(matches);
  var discCount = shown.reduce(function (n, g) { return n + g.discs.length; }, 0);
  document.getElementById('status').textContent = shown.length + ' of ' + state.groups.length + ' titles · ' +
    discCount + ' of ' + state.data.discs.length + ' discs' + (state.stale ? ' · updating…' : '');
  document.getElementById('grid').innerHTML = shown.map(card).join('');
}

function card(g) {
  var d = g.discs[0];
  var item = g.items[0];
  var out = g.discs.some(function (x) { return x.where !== x.owner; });
  var requested = g.discs.some(function (x) { return (x.requests || []).length; });
  var poster = item && item.poster
    ? '<img loading="lazy" decoding="async" class="poster w-full object-cover" src="' + IMG + 'w185' + esc(item.poster) + '"' +
      ' srcset="' + IMG + 'w185' + esc(item.poster) + ' 185w, ' + IMG + 'w342' + esc(item.poster) + ' 342w"' +
      ' sizes="(min-width: 1024px) 16vw, (min-width: 768px) 25vw, 33vw" alt="">'
    : '<div class="poster w-full flex items-center justify-center p-3 text-center text-sm text-gray-400 bg-white/5">' + esc(d.title) + '</div>';
  return '<button class="text-left group self-start" onclick="openGroup(\'' + esc(g.key) + '\')">' +
    '<div class="relative rounded-lg overflow-hidden ring-1 ring-white/10 group-hover:ring-white/40 transition">' + poster +
      (g.items.length > 1 ? '<span class="absolute top-2 left-2 text-xs bg-black/70 rounded px-1.5 py-0.5">' + g.items.length + ' films</span>' : '') +
      (out ? '<span class="absolute top-2 right-2 text-xs bg-amber-500 text-black rounded px-1.5 py-0.5">lent</span>' : '') +
      (requested ? '<span class="absolute bottom-2 right-2 text-xs bg-sky-500 text-black rounded px-1.5 py-0.5">requested</span>' : '') +
      (groupSeenBy(g, state.data.user.name) ? '<span class="absolute bottom-2 left-2 text-xs bg-emerald-600 rounded px-1.5 py-0.5">✓ seen</span>' : '') +
    '</div>' +
    '<div class="mt-1 sm:mt-1.5 text-xs sm:text-sm font-medium leading-tight line-clamp-2">' + esc(d.title) + '</div>' +
    '<div class="text-[11px] sm:text-xs text-gray-400 truncate">' + esc(d.years[0] || '') + ' · ' + esc(formatBadges(g.discs)) + '</div>' +
  '</button>';
}

function formatBadges(discs) {
  var f = {};
  discs.forEach(function (d) { d.formats.forEach(function (x) { f[x.replace(' Blu Ray', '').replace('4k', '4K')] = true; }); });
  return Object.keys(f).join(' / ');
}

function openGroup(key) {
  var g = state.groups.filter(function (x) { return x.key === key; })[0];
  if (!g) return closeModal();
  state.openKey = key;
  var first = g.items[0];
  var backdrop = first && first.backdrop ? '<img decoding="async" class="w-full h-48 sm:h-64 object-cover opacity-70" src="' + IMG + 'w780' + esc(first.backdrop) + '" alt="">' : '';
  var films = g.items.length ? g.items.map(function (i) { return itemBlock(i, g); }).join('') :
    '<p class="text-sm text-gray-400">No movie data yet. It is fetched automatically within the hour.</p>' +
    seenRow(seenKey(null, g), g.discs[0].title);
  document.getElementById('detail').innerHTML =
    '<div class="relative">' + backdrop +
      '<button onclick="closeModal()" class="absolute top-3 right-3 bg-black/60 rounded-full w-8 h-8">✕</button></div>' +
    '<div class="p-5 space-y-5">' +
      '<h2 class="text-2xl font-semibold">' + esc(g.discs[0].title) + '</h2>' +
      films +
      '<div><h3 class="text-sm uppercase tracking-wide text-gray-400 mb-2">Copies</h3>' + g.discs.map(copyBlock).join('') + '</div>' +
    '</div>';
  document.getElementById('modal').classList.remove('hidden');
}

function itemBlock(i, g) {
  var facts = [i.year, i.runtime ? i.runtime + ' min' : '', i.episodes ? i.episodes + ' episodes' : '', (i.genres || []).join(', '),
    i.rating ? '★ ' + i.rating + ' TMDB' : ''].filter(Boolean).join(' · ');
  var links = (i.imdbId ? '<a class="underline" target="_blank" href="https://www.imdb.com/title/' + esc(i.imdbId) + '/">IMDb</a> · ' : '') +
    '<a class="underline" target="_blank" href="https://www.themoviedb.org/' + esc(i.kind) + '/' + esc(i.tmdbId) + '">TMDB</a> · ' +
    '<a class="underline" target="_blank" href="' + esc(trailerUrl(i)) + '">▶ Trailer</a>';
  return '<div class="flex gap-4">' +
    (i.poster ? '<img loading="lazy" decoding="async" class="w-24 rounded hidden sm:block self-start" src="' + IMG + 'w185' + esc(i.poster) + '" alt="">' : '') +
    '<div class="space-y-1 text-sm">' +
      '<div class="font-medium text-base">' + esc(i.title) + '</div>' +
      '<div class="text-gray-400">' + esc(facts) + '</div>' +
      '<p class="text-gray-200">' + esc(i.overview) + '</p>' +
      (i.directors && i.directors.length ? '<div class="text-gray-400">By ' + esc(i.directors.join(', ')) + '</div>' : '') +
      (i.cast && i.cast.length ? '<div class="text-gray-400">With ' + esc(i.cast.join(', ')) + '</div>' : '') +
      '<div class="text-gray-400">' + links + '</div>' +
      seenRow(seenKey(i, g), i.title) +
    '</div></div>';
}

// ---------- Seen ----------
// Each person ticks themselves and their household (kids, a partner: plain names, not app users).
// A film is keyed by its TMDB id, so a film counts as seen on every disc it is on, collections included.
// TV seasons share a TMDB id, so they, and discs without movie data, are keyed by the disc.

var HOUSEHOLD = '#household';
var seenQueue = Promise.resolve();
var seenPending = 0;

function viewers() {
  return [state.data.user.name].concat(state.data.household || []);
}

function seenKey(item, g) {
  return item && item.kind === 'movie' ? 'movie:' + item.tmdbId : 'disc:' + g.discs[0].key;
}

function groupKeys(g) {
  return g.items.length ? g.items.map(function (i) { return seenKey(i, g); }) : [seenKey(null, g)];
}

function isSeen(key, person) {
  return ((state.data.seen || {})[key] || []).indexOf(person) >= 0;
}

// A collection counts as seen once every film in it is.
function groupSeenBy(g, person) {
  return groupKeys(g).every(function (k) { return isSeen(k, person); });
}

function seenRow(key, title) {
  var chips = viewers().map(function (p) {
    var on = isSeen(key, p);
    return '<button data-seen-key="' + esc(key) + '" data-person="' + esc(p) + '" data-title="' + esc(title) + '" aria-pressed="' + on + '"' +
      ' class="rounded-full px-2.5 py-0.5 text-xs ' + (on ? 'bg-emerald-600 hover:bg-emerald-500' : 'bg-white/10 hover:bg-white/20 text-gray-300') + '">' +
      (on ? '✓ ' : '') + esc(p) + '</button>';
  }).join('');
  return '<div class="flex flex-wrap items-center gap-1.5 pt-1"><span class="text-gray-400 mr-1">Seen by</span>' + chips +
    '<button class="text-xs text-gray-400 underline hover:text-gray-200 ml-1" onclick="openHousehold()">' +
      (state.data.household && state.data.household.length ? 'Edit household' : '+ Add kids or family') + '</button></div>';
}

// The tick shows at once; the saves go out one after another so a later click is never undone by an earlier answer.
function toggleSeen(key, person, title) {
  var seen = state.data.seen = state.data.seen || {};
  var list = seen[key] = (seen[key] || []).slice();
  var on = list.indexOf(person) < 0;
  if (on) list.push(person); else list.splice(list.indexOf(person), 1);
  redraw();
  seenPending++;
  seenQueue = seenQueue.then(function () {
    return api('seen', { movie: key, title: title, person: person, seen: on });
  }).then(function (data) {
    if (--seenPending === 0) fresh(data);
  }, function (err) {
    seenPending--;
    changeFailed(err);
  });
}

function redraw() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state.data)); } catch (e) {}
  applyFilters();
  if (state.openKey === HOUSEHOLD) openHousehold();
  else if (state.openKey === REQUESTS) openRequests();
  else if (state.openKey) openGroup(state.openKey);
}

// ---------- Requests ----------
// Anyone who doesn't have a disc can request it, with an optional note. The request is for whoever has the disc,
// so the overview is a packing list for the next meeting: what to bring for whom, and what to collect from whom.

var REQUESTS = '#requests';

function requestList() {
  var me = state.data.user.name;
  var out = { toMe: [], mine: [] };
  state.data.discs.forEach(function (d) {
    (d.requests || []).forEach(function (r) {
      if (d.where === me) out.toMe.push({ d: d, r: r });
      if (r.by === me) out.mine.push({ d: d, r: r });
    });
  });
  return out;
}

// Groups rows by a person ("For Anna", "From Matthias"), people and titles in alphabetical order.
function byPerson(rows, person, heading, row) {
  var groups = {};
  rows.forEach(function (x) { (groups[person(x)] = groups[person(x)] || []).push(x); });
  return Object.keys(groups).sort().map(function (p) {
    var list = groups[p].sort(function (a, b) { return sortTitle(a.d.title).localeCompare(sortTitle(b.d.title)); });
    return '<div><h4 class="font-medium mb-1.5">' + heading + ' ' + esc(p) + ' (' + list.length + ')</h4>' +
      '<ul class="space-y-1.5">' + list.map(row).join('') + '</ul></div>';
  }).join('');
}

function requestRow(x, buttons) {
  return '<li class="flex flex-wrap items-center gap-2 bg-white/5 rounded px-3 py-2">' +
    '<div class="mr-auto"><div>' + esc(x.d.title) + ' <span class="text-gray-400">· ' + esc(x.d.formats.join(', ')) + '</span></div>' +
      '<div class="text-xs text-gray-400">' + (x.r.by === x.d.owner ? 'Back to the owner · ' : '') + 'asked ' + esc(new Date(x.r.at).toLocaleDateString()) +
      (x.r.note ? ' · “' + esc(x.r.note) + '”' : '') + '</div></div>' + buttons + '</li>';
}

function openRequests() {
  state.openKey = REQUESTS;
  var lists = requestList();
  var btn = 'rounded px-3 py-1 text-xs ';
  var toMe = lists.toMe.length ? byPerson(lists.toMe, function (x) { return x.r.by; }, 'For', function (x) {
    var hand = x.r.by === x.d.owner
      ? '<button class="' + btn + 'bg-emerald-600 hover:bg-emerald-500" onclick="giveBack(\'' + esc(x.d.key) + '\')">Mark returned</button>'
      : '<button class="' + btn + 'bg-emerald-600 hover:bg-emerald-500" onclick="lendFor(\'' + esc(x.r.id) + '\')">Lend to ' + esc(x.r.by) + '</button>';
    return requestRow(x, hand + '<button class="' + btn + 'bg-white/10 hover:bg-white/20" onclick="closeRequest(\'' + esc(x.r.id) + '\', \'decline\')">Decline</button>');
  }) : '<p class="text-gray-400">Nobody has asked you for a disc.</p>';
  var mine = lists.mine.length ? byPerson(lists.mine, function (x) { return x.d.where; }, 'From', function (x) {
    return requestRow(x, '<button class="' + btn + 'bg-white/10 hover:bg-white/20" onclick="closeRequest(\'' + esc(x.r.id) + '\', \'cancel\')">Cancel</button>');
  }) : '<p class="text-gray-400">You haven\'t asked for any discs. Open a movie and press Request on a copy you don\'t have.</p>';
  document.getElementById('detail').innerHTML =
    '<div class="p-5 space-y-5 text-sm">' +
      '<div class="flex items-center"><h2 class="text-xl font-semibold mr-auto">Requests</h2>' +
        '<button onclick="closeModal()" class="bg-white/10 rounded-full w-8 h-8">✕</button></div>' +
      '<section class="space-y-3"><h3 class="text-sm uppercase tracking-wide text-gray-400">Asked of me: bring these</h3>' + toMe + '</section>' +
      '<section class="space-y-3"><h3 class="text-sm uppercase tracking-wide text-gray-400">I asked for: collect these</h3>' + mine + '</section>' +
    '</div>';
  document.getElementById('modal').classList.remove('hidden');
}

// Lends the disc to whoever made this request.
function lendFor(id) {
  requestList().toMe.forEach(function (x) { if (x.r.id === id) lendTo(x.d.key, x.r.by); });
}

function requestDisc(key) {
  var note = document.getElementById('note-' + key).value;
  busy();
  api('request', { key: key, note: note }).then(fresh, changeFailed);
}

function closeRequest(id, how) {
  busy();
  api('closeRequest', { id: id, how: how }).then(fresh, changeFailed);
}

// ---------- Household ----------

function openHousehold() {
  if (state.openKey !== HOUSEHOLD) state.backKey = state.openKey;
  state.openKey = HOUSEHOLD;
  var names = state.data.household || [];
  var list = names.length ? names.map(function (n, i) {
    return '<li class="flex items-center justify-between bg-white/5 rounded px-3 py-2"><span>' + esc(n) + '</span>' +
      '<button class="text-xs text-gray-400 underline hover:text-gray-200" onclick="removeMember(' + i + ')">Remove</button></li>';
  }).join('') : '<li class="text-gray-400">Nobody yet.</li>';
  document.getElementById('detail').innerHTML =
    '<div class="p-5 space-y-4 text-sm">' +
      '<div class="flex items-center"><h2 class="text-xl font-semibold mr-auto">Your household</h2>' +
        '<button onclick="closeHousehold()" class="bg-white/10 rounded-full w-8 h-8">✕</button></div>' +
      '<p class="text-gray-400">Add the people you watch with, like your kids. They don\'t need an account: ' +
        'you tick them on a movie to mark that they have seen it. Only you see your household and its ticks.</p>' +
      '<ul class="space-y-1.5">' + list + '</ul>' +
      '<form class="flex gap-2" onsubmit="addMember(event)">' +
        '<input id="newMember" maxlength="40" placeholder="Name, e.g. Mia" class="flex-1 bg-white/5 rounded px-3 py-1.5 outline-none focus:ring-1 ring-white/30">' +
        '<button class="bg-white/10 hover:bg-white/20 rounded px-3 py-1.5">Add</button></form>' +
      '<div class="text-right"><button onclick="closeHousehold()" class="bg-emerald-600 hover:bg-emerald-500 rounded px-4 py-1.5">Done</button></div>' +
    '</div>';
  document.getElementById('modal').classList.remove('hidden');
}

function closeHousehold() {
  var back = state.backKey;
  state.backKey = null;
  if (back) openGroup(back); else closeModal();
}

function addMember(e) {
  e.preventDefault();
  var name = document.getElementById('newMember').value.replace(/\s+/g, ' ').trim();
  if (!name) return;
  saveHousehold((state.data.household || []).concat([name]));
}

function removeMember(i) {
  var names = (state.data.household || []).slice();
  names.splice(i, 1);
  saveHousehold(names);
}

function saveHousehold(names) {
  state.data.household = names;
  redraw();
  busy();
  api('household', { names: names }).then(fresh, changeFailed);
}

// The trailer TMDB lists, or a YouTube search when it lists none.
function trailerUrl(i) {
  if (i.trailer) return 'https://www.youtube.com/watch?v=' + encodeURIComponent(i.trailer);
  return 'https://www.youtube.com/results?search_query=' + encodeURIComponent(i.title + ' ' + (i.year || '') + ' trailer');
}

function copyBlock(d) {
  var me = state.data.user.name;
  var canAct = me === d.owner || me === d.where;
  var others = state.data.people.filter(function (p) { return p !== d.where; });
  var reqs = d.requests || [];
  var mine = reqs.filter(function (r) { return r.by === me; })[0];
  var actions = '';
  if (canAct) {
    // The lend list starts at whoever asked first.
    var first = reqs.length ? reqs[0].by : '';
    actions = '<div class="flex flex-wrap gap-2 mt-2">' +
      '<select id="to-' + esc(d.key) + '" class="bg-white/5 rounded px-2 py-1 text-sm">' +
        others.map(function (p) { return '<option' + (p === first ? ' selected' : '') + '>' + esc(p) + '</option>'; }).join('') + '</select>' +
      '<button class="bg-white/10 hover:bg-white/20 rounded px-3 py-1 text-sm" onclick="lend(\'' + esc(d.key) + '\')">Lend</button>' +
      (d.where !== d.owner ? '<button class="bg-emerald-600 hover:bg-emerald-500 rounded px-3 py-1 text-sm" onclick="giveBack(\'' + esc(d.key) + '\')">Mark returned</button>' : '') +
    '</div>';
  }
  if (me !== d.where) {
    actions += mine
      ? '<div class="flex flex-wrap items-center gap-2 mt-2 text-sky-300">You asked for this disc' + (mine.note ? ' (“' + esc(mine.note) + '”)' : '') + '.' +
        '<button class="bg-white/10 hover:bg-white/20 text-gray-100 rounded px-3 py-1 text-sm" onclick="closeRequest(\'' + esc(mine.id) + '\', \'cancel\')">Cancel request</button></div>'
      : '<div class="flex flex-wrap gap-2 mt-2">' +
        '<input id="note-' + esc(d.key) + '" maxlength="200" placeholder="Note, e.g. for Saturday (optional)" class="flex-1 min-w-0 bg-white/5 rounded px-2 py-1 text-sm outline-none focus:ring-1 ring-white/30">' +
        '<button class="bg-sky-600 hover:bg-sky-500 rounded px-3 py-1 text-sm" onclick="requestDisc(\'' + esc(d.key) + '\')">' + (me === d.owner ? 'Ask for it back' : 'Request') + '</button></div>';
  }
  var requested = reqs.length ? '<div class="text-sky-300">Requested by ' + reqs.map(function (r) {
    return esc(r.by) + (r.note ? ' (“' + esc(r.note) + '”)' : '');
  }).join(', ') + '</div>' : '';
  var history = d.history.length ? '<details class="mt-2 text-xs text-gray-400"><summary class="cursor-pointer">History (' + d.history.length + ')</summary>' +
    d.history.slice().reverse().map(function (h) {
      return '<div>' + esc(new Date(h.at).toLocaleDateString()) + ': ' + esc(h.from) + ' → ' + esc(h.to) + (h.note ? ' (' + esc(h.note) + ')' : '') + '</div>';
    }).join('') + '</details>' : '';
  return '<div class="rounded-lg bg-white/5 p-3 mb-2 text-sm">' +
    '<div><span class="font-medium">' + esc(d.formats.join(', ')) + '</span>' + (d.notes && d.type.indexOf('collection') < 0 ? ' · ' + esc(d.notes) : '') + '</div>' +
    '<div class="text-gray-400">Owner: ' + esc(d.owner) + ' · Currently at: <span class="' + (d.where !== d.owner ? 'text-amber-400' : '') + '">' + esc(d.where) + '</span></div>' +
    requested + actions + history + '</div>';
}

function lend(key) {
  lendTo(key, document.getElementById('to-' + key).value);
}

function lendTo(key, to) {
  busy();
  api('lend', { key: key, to: to, seenWhere: discByKey(key).where }).then(fresh, changeFailed);
}

function giveBack(key) {
  busy();
  api('return', { key: key, seenWhere: discByKey(key).where }).then(fresh, changeFailed);
}

function discByKey(key) {
  return state.data.discs.filter(function (d) { return d.key === key; })[0];
}

function busy() { document.getElementById('status').textContent = 'Saving…'; }

function closeModal() {
  state.openKey = null;
  state.backKey = null;
  document.getElementById('modal').classList.add('hidden');
}

['q', 'fOwner', 'fStatus', 'fFormat', 'fType', 'fSeen'].forEach(function (id) {
  document.getElementById(id).addEventListener('input', applyFilters);
  document.getElementById(id).addEventListener('input', markSetFilters);
});
document.getElementById('detail').addEventListener('click', function (e) {
  var b = e.target.closest('[data-seen-key]');
  if (b) toggleSeen(b.dataset.seenKey, b.dataset.person, b.dataset.title);
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });
load();
</script>
<script src="https://accounts.google.com/gsi/client" async onload="initSignIn()"></script>
</body>
</html>
