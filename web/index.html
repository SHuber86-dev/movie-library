<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Movie Library</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="config.js"></script>
  <style>
    body { background: #0f1115; }
    .poster { aspect-ratio: 2 / 3; }
    .filters[hidden] { display: none !important; } /* sm:flex would otherwise show a hidden filter bar */
    #views button[aria-pressed="true"] { background: #f3f4f6; color: #111827; }
    /* Desktop filter dropdowns: solid dark fields with readable option lists, and a clear
       highlight on any filter that is not at its default. Phones keep their native look. */
    @media (min-width: 640px) {
      .filters select {
        background: #1d2230; color: #f3f4f6; border: 1px solid #3b4252;
        color-scheme: dark; cursor: pointer;
      }
      .filters select:hover { border-color: #7b8494; }
      .filters select:focus { outline: none; border-color: #e5e7eb; box-shadow: 0 0 0 1px #e5e7eb; }
      .filters select option { background: #1d2230; color: #f3f4f6; }
      .filters select.is-set { background: #f59e0b; color: #111827; border-color: #fbbf24; font-weight: 600; }
    }
  </style>
</head>
<body class="text-gray-100 font-sans">
  <header class="sticky top-0 z-10 bg-[#0f1115]/95 backdrop-blur border-b border-white/10">
    <div class="max-w-7xl mx-auto px-4 py-2 sm:py-3 flex flex-wrap gap-2 items-center">
      <h1 class="text-lg font-semibold">🎬 Movie Library</h1>
      <nav id="views" class="hidden mr-auto ml-1 flex rounded-full bg-white/5 p-0.5 text-sm">
        <button id="tabLibrary" class="rounded-full px-3 py-0.5" onclick="showView('library')">Library</button>
        <button id="tabWishlist" class="rounded-full px-3 py-0.5" onclick="showView('wishlist')">Wishlist</button>
      </nav>
      <span class="mr-auto" id="viewsSpacer"></span>
      <button id="requestsBtn" class="hidden text-sm text-gray-400 underline hover:text-gray-200" onclick="openRequests()">Requests</button>
      <button id="householdBtn" class="hidden text-sm text-gray-400 underline hover:text-gray-200" onclick="openHousehold()">Household</button>
      <span id="who" class="text-sm text-gray-400"></span>
      <div id="signin" class="hidden"></div>
    </div>
    <div id="filters" class="filters max-w-7xl mx-auto px-4 pb-2 sm:pb-3 grid grid-cols-4 gap-1.5 sm:flex sm:flex-wrap sm:gap-2 text-xs sm:text-sm">
      <div class="relative col-span-4 sm:flex-1 sm:min-w-[12rem]">
        <input id="q" autocomplete="off" placeholder="Search the library, or find a movie or series to add…" class="w-full bg-white/5 rounded pl-3 pr-9 py-1.5 sm:py-2 outline-none focus:ring-1 ring-white/30">
        <button type="button" data-clear="q" hidden aria-label="Clear search" class="absolute right-1 top-1/2 -translate-y-1/2 w-7 h-7 rounded-full text-gray-400 hover:text-gray-100 hover:bg-white/10">✕</button>
      </div>
      <select id="fOwner" class="min-w-0 bg-white/5 rounded px-1 sm:px-2 py-1.5 sm:py-2"><option value="">All owners</option></select>
      <select id="fStatus" class="min-w-0 bg-white/5 rounded px-1 sm:px-2 py-1.5 sm:py-2">
        <option value="">Any status</option><option value="home">At owner</option><option value="out">Lent out</option><option value="mine">My shelf</option><option value="requested">Requested</option>
      </select>
      <select id="fFormat" class="min-w-0 bg-white/5 rounded px-1 sm:px-2 py-1.5 sm:py-2">
        <option value="">All formats</option><option>HD Blu Ray</option><option>4k Blu Ray</option><option>3D Blu Ray</option><option>Digital</option>
      </select>
      <select id="fType" class="min-w-0 bg-white/5 rounded px-1 sm:px-2 py-1.5 sm:py-2">
        <option value="">All types</option><option>Film</option><option>Film collection</option><option value="TV">TV</option>
      </select>
      <select id="fSeen" class="col-span-2 min-w-0 bg-white/5 rounded px-1 sm:px-2 py-1.5 sm:py-2"><option value="">Seen or not</option></select>
      <select id="fGenre" class="col-span-2 min-w-0 bg-white/5 rounded px-1 sm:px-2 py-1.5 sm:py-2"><option value="">All genres</option></select>
    </div>
    <div id="wishFilters" hidden class="filters max-w-7xl mx-auto px-4 pb-2 sm:pb-3 grid grid-cols-3 gap-1.5 sm:flex sm:flex-wrap sm:gap-2 text-xs sm:text-sm">
      <div class="relative col-span-3 sm:flex-1 sm:min-w-[12rem]">
        <input id="wq" autocomplete="off" placeholder="Search the wishlist, or find a movie or series to add…" class="w-full bg-white/5 rounded pl-3 pr-9 py-1.5 sm:py-2 outline-none focus:ring-1 ring-white/30">
        <button type="button" data-clear="wq" hidden aria-label="Clear search" class="absolute right-1 top-1/2 -translate-y-1/2 w-7 h-7 rounded-full text-gray-400 hover:text-gray-100 hover:bg-white/10">✕</button>
      </div>
      <select id="wKind" class="min-w-0 bg-white/5 rounded px-1 sm:px-2 py-1.5 sm:py-2">
        <option value="">Movies & series</option><option value="movie">Movies</option><option value="tv">Series</option>
      </select>
      <select id="wBy" class="min-w-0 bg-white/5 rounded px-1 sm:px-2 py-1.5 sm:py-2"><option value="">Added by anyone</option></select>
      <select id="wSort" class="min-w-0 bg-white/5 rounded px-1 sm:px-2 py-1.5 sm:py-2">
        <option value="">Newest first</option><option value="title">Title</option><option value="year">Release year</option>
      </select>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-2 sm:py-4">
    <p id="status" class="text-gray-400 text-xs sm:text-sm mb-2 sm:mb-3">Loading library…</p>
    <p id="notice" class="hidden fixed bottom-4 left-4 right-4 sm:left-auto sm:max-w-sm z-30 bg-amber-500 text-black text-sm rounded-lg px-4 py-3 shadow-lg"></p>
    <section id="libResults" class="mb-4"></section>
    <div id="grid" class="grid grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-2 sm:gap-4"></div>
    <div id="wishView" class="hidden space-y-4">
      <section id="addResults"></section>
      <div id="wishGrid" class="grid grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-2 sm:gap-4"></div>
    </div>
  </main>

  <div id="modal" class="fixed inset-0 z-20 hidden bg-black/70 overflow-y-auto" onclick="if (event.target === this) closeModal()">
    <div id="detail" class="max-w-3xl mx-auto my-6 mx-4 sm:mx-auto bg-[#171a21] rounded-xl overflow-hidden"></div>
  </div>

  <footer class="max-w-7xl mx-auto px-4 py-6 text-xs text-gray-500">
    Movie data and images from <a class="underline" href="https://www.themoviedb.org" target="_blank">TMDB</a>.
    This product uses the TMDB API but is not endorsed or certified by TMDB.
  </footer>

<script>
var IMG = 'https://image.tmdb.org/t/p/';
var STORE_KEY = 'movie-library:v1';
var TOKEN_KEY = 'movie-library:token';
var OUTBOX_KEY = 'movie-library:seen-outbox';
var CONFIG = window.MOVIE_LIBRARY_CONFIG || {};
// rev.full: the server rev of the library shown; rev.personal: of the seen marks and household shown, which a tick's
// answer can bring newer than the rest. An answer older than what is shown is dropped.
var state = { data: null, groups: [], view: location.hash === '#wishlist' ? 'wishlist' : 'library', rev: { full: 0, personal: 0 } };
var SAVE_DELAY = 1000;  // this browser's copy of the library is written at most this often
var FILTER_DELAY = 100; // typing in a search box redraws the grid after this pause
var timers = { save: null, filter: null };
var auth = { token: null, exp: 0, waiting: [], gis: false };

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

// ---------- Sign-in ----------
// Google Identity Services gives the page an ID token (valid for an hour), which is sent with every request.
// The Apps Script API checks it and only answers people the sheet is shared with.

function initSignIn() {
  google.accounts.id.initialize({
    client_id: CONFIG.clientId,
    callback: signedIn,
    auto_select: true,
    cancel_on_tap_outside: false,
    use_fedcm_for_prompt: true
  });
  google.accounts.id.renderButton(document.getElementById('signin'), { theme: 'filled_black', size: 'medium', shape: 'pill', text: 'signin' });
  auth.gis = true;
  if (auth.waiting.length) google.accounts.id.prompt();
}

function signedIn(resp) {
  auth.token = resp.credential;
  auth.exp = jwtPayload(resp.credential).exp;
  try { localStorage.setItem(TOKEN_KEY, JSON.stringify({ token: auth.token, exp: auth.exp })); } catch (e) {}
  document.getElementById('signin').classList.add('hidden');
  var waiting = auth.waiting;
  auth.waiting = [];
  waiting.forEach(function (resolve) { resolve(auth.token); });
}

function jwtPayload(jwt) {
  var b64 = jwt.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
  return JSON.parse(decodeURIComponent(escape(atob(b64))));
}

function tokenValid() {
  return auth.token && auth.exp * 1000 > Date.now() + 60000;
}

// Resolves with a fresh token, asking Google for one (silently when possible) if needed.
function getToken() {
  if (tokenValid()) return Promise.resolve(auth.token);
  forgetToken();
  return new Promise(function (resolve) {
    auth.waiting.push(resolve);
    if (auth.waiting.length > 1) return;
    document.getElementById('signin').classList.remove('hidden');
    if (!state.data) document.getElementById('status').textContent = 'Sign in with your Google account to see the library.';
    if (auth.gis) google.accounts.id.prompt();
  });
}

function forgetToken() {
  auth.token = null;
  try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
}

function signOut() {
  flushSeen(); // the outbox belongs to this account, so it is sent now and not kept for the next one
  writeOutbox({});
  clearTimeout(timers.save);
  state.data = null; // so nothing writes this account's library back while the page reloads
  forgetToken();
  try { localStorage.removeItem(STORE_KEY); } catch (e) {}
  if (auth.gis) google.accounts.id.disableAutoSelect();
  location.reload();
}

// Every call is a POST with a plain-text JSON body, so the browser sends it without a CORS preflight.
function api(action, params, retried) {
  if (!CONFIG.apiUrl || !/^https:/.test(CONFIG.apiUrl)) return Promise.reject(new Error('Set apiUrl in config.js to the Apps Script /exec URL.'));
  return getToken().then(function (token) {
    var body = Object.assign({ action: action, token: token }, params || {});
    // keepalive lets a save that starts as the page is closed still reach the server.
    return fetch(CONFIG.apiUrl, { method: 'POST', body: JSON.stringify(body), keepalive: action === 'seen' });
  }).then(function (res) {
    if (!res.ok) throw new Error('The server answered ' + res.status + '. Please try again.');
    return res.json();
  }).then(function (res) {
    if (res.ok) return res.data;
    if (res.code === 'signin' && !retried) {
      forgetToken();
      return api(action, params, true);
    }
    var err = new Error(res.error);
    err.code = res.code;
    throw err;
  });
}

// ---------- Data ----------

// This browser's last copy is shown at once while the sheet is asked again; lending always checks the sheet first.
function load() {
  try {
    var t = JSON.parse(localStorage.getItem(TOKEN_KEY));
    if (t) { auth.token = t.token; auth.exp = t.exp; }
  } catch (e) {}
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem(STORE_KEY)); } catch (e) {}
  if (saved) {
    state.rev.full = state.rev.personal = saved.rev || 0;
    render(withOutbox(saved), true);
  }
  refresh();
  flushSeen(); // ticks left over from the last visit
}

// The server answers "unchanged" when the copy shown is still the newest, so a reload doesn't fetch it all again.
function refresh() {
  api('library', state.data && state.rev.full ? { have: state.rev.full } : {}).then(fresh, fail);
}

// Answers can arrive in any order (a reload and a tick save, say), so each one is checked against what is shown.
function fresh(data) {
  var rev = data.rev || 0;
  if (data.unchanged || rev < state.rev.full) {
    if (state.data) { state.stale = false; applyFilters(); }
    return;
  }
  if (rev < state.rev.personal && state.data) {
    // A tick's answer brought newer marks than this; keep those.
    data.seen = state.data.seen;
    data.household = state.data.household;
  }
  state.rev.full = rev;
  state.rev.personal = Math.max(state.rev.personal, rev);
  withOutbox(data);
  render(data, false);
  saveSoon();
}

// The answer to a tick: only the seen marks and household.
function freshPersonal(p) {
  if (p.discs) return fresh(p); // a server from before short answers sends the whole library
  if (!state.data || (p.rev || 0) < state.rev.personal) return;
  state.rev.personal = p.rev || 0;
  state.data.seen = p.seen;
  state.data.household = p.household;
  withOutbox(state.data);
  redraw();
}

function saveSoon() {
  clearTimeout(timers.save);
  timers.save = setTimeout(saveNow, SAVE_DELAY);
}

function saveNow() {
  clearTimeout(timers.save);
  if (!state.data) return;
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state.data)); } catch (e) {}
}

function fail(err) {
  var status = document.getElementById('status');
  status.textContent = 'Error: ' + (err && err.message || err);
  if (err && err.code === 'denied') {
    status.insertAdjacentHTML('beforeend', ' <button class="underline" onclick="signOut()">Use another account</button>');
    document.getElementById('grid').innerHTML = '';
  }
}

// A lend or return can fail because the disc moved since the page loaded; show the error, then reload the data.
function changeFailed(err) {
  alertBox(err && err.message || err);
  refresh();
}

function alertBox(msg) {
  var box = document.getElementById('notice');
  box.textContent = msg;
  box.classList.remove('hidden');
  setTimeout(function () { box.classList.add('hidden'); }, 6000);
}

function render(data, stale) {
  state.data = data;
  state.stale = !!stale;
  document.getElementById('who').innerHTML = 'Signed in as ' + esc(data.user.name) +
    ' · <button class="underline hover:text-gray-200" onclick="signOut()">Sign out</button>';
  var owners = {};
  data.discs.forEach(function (d) { owners[d.owner] = true; });
  var sel = document.getElementById('fOwner');
  var current = sel.value;
  sel.innerHTML = '<option value="">All owners</option>' + Object.keys(owners).sort().map(function (o) {
    return '<option>' + esc(o) + '</option>';
  }).join('');
  sel.value = current;
  var seenSel = document.getElementById('fSeen');
  var seenCurrent = seenSel.value;
  seenSel.innerHTML = '<option value="">Seen or not</option>' + viewers().map(function (p) {
    return '<option value="not:' + esc(p) + '">Not seen by ' + esc(p) + '</option><option value="by:' + esc(p) + '">Seen by ' + esc(p) + '</option>';
  }).join('');
  seenSel.value = seenCurrent;
  if (seenSel.value !== seenCurrent) seenSel.value = '';
  var genreSel = document.getElementById('fGenre');
  var genreCurrent = genreSel.value;
  genreSel.innerHTML = '<option value="">All genres</option>' + genreList(data).map(function (c) {
    return '<option>' + esc(c) + '</option>';
  }).join('');
  genreSel.value = genreCurrent;
  if (genreSel.value !== genreCurrent) genreSel.value = '';
  document.getElementById('householdBtn').classList.remove('hidden');
  var askedOfMe = requestList().toMe.length;
  var reqBtn = document.getElementById('requestsBtn');
  reqBtn.innerHTML = 'Requests' + (askedOfMe ? ' <span class="inline-block bg-sky-500 text-black rounded-full px-1.5 text-xs font-semibold">' + askedOfMe + '</span>' : '');
  reqBtn.classList.remove('hidden');
  var wishCount = (data.wishlist || []).length;
  document.getElementById('tabWishlist').textContent = 'Wishlist' + (wishCount ? ' (' + wishCount + ')' : '');
  document.getElementById('views').classList.remove('hidden');
  document.getElementById('viewsSpacer').classList.add('hidden');
  var bySel = document.getElementById('wBy');
  var byCurrent = bySel.value;
  var adders = {};
  (data.wishlist || []).forEach(function (w) { if (w.by) adders[w.by] = true; });
  bySel.innerHTML = '<option value="">Added by anyone</option>' + Object.keys(adders).sort().map(function (p) {
    return '<option>' + esc(p) + '</option>';
  }).join('');
  bySel.value = byCurrent;
  if (bySel.value !== byCurrent) bySel.value = '';
  showView(state.view, true);
  markSetFilters();

  // One card per movie: discs matched to the same single TMDB movie are grouped together.
  // TV discs always get their own card, since seasons of one show share a TMDB id.
  var map = {};
  state.groups = [];
  data.discs.forEach(function (d) {
    var items = d.meta && d.meta.items || [];
    var k = items.length === 1 && items[0].kind === 'movie' ? 'movie:' + items[0].tmdbId : 'disc:' + d.key;
    if (!map[k]) { map[k] = { key: k, discs: [], items: items }; state.groups.push(map[k]); }
    map[k].discs.push(d);
  });
  state.groups.sort(function (a, b) { return sortTitle(a.discs[0].title).localeCompare(sortTitle(b.discs[0].title)); });
  applyFilters();
  if (state.openKey === HOUSEHOLD) openHousehold();
  else if (state.openKey === REQUESTS) openRequests();
  else if (state.openKey && state.openKey.indexOf(WISH_PREFIX) === 0) openWish(state.openKey.slice(WISH_PREFIX.length));
  else if (state.openKey && state.openKey.indexOf(ADD_PREFIX) === 0) return; // keep what is typed into the add form
  else if (state.openKey) openGroup(state.openKey);
}

// "The Matrix" sorts under M.
function sortTitle(t) {
  return t.replace(/^(the|a|an)\s+/i, '');
}

function matches(g) {
  var q = document.getElementById('q').value.trim().toLowerCase();
  var owner = document.getElementById('fOwner').value;
  var status = document.getElementById('fStatus').value;
  var format = document.getElementById('fFormat').value;
  var type = document.getElementById('fType').value;
  var me = state.data.user.name;
  var discs = g.discs.filter(function (d) {
    if (owner && d.owner !== owner) return false;
    if (status === 'home' && d.where !== d.owner) return false;
    if (status === 'out' && d.where === d.owner) return false;
    if (status === 'mine' && d.owner !== me && d.where !== me) return false;
    if (status === 'requested' && !(d.requests || []).length) return false;
    if (format && d.formats.indexOf(format) < 0) return false;
    if (type && (type === 'TV' ? d.type.indexOf('TV') !== 0 : d.type !== type)) return false;
    return true;
  });
  if (!discs.length) return false;
  var genre = document.getElementById('fGenre').value;
  if (genre && groupCategories(g).indexOf(genre) < 0) return false;
  var seen = document.getElementById('fSeen').value;
  if (seen) {
    var person = seen.slice(seen.indexOf(':') + 1);
    if (groupSeenBy(g, person) !== (seen.indexOf('by:') === 0)) return false;
  }
  if (!q) return true;
  var hay = [g.discs[0].title, g.discs[0].notes].concat(g.items.map(function (i) {
    return [i.title, (i.cast || []).join(' '), (i.directors || []).join(' '), (i.genres || []).join(' ')].join(' ');
  })).join(' ').toLowerCase();
  return hay.indexOf(q) >= 0;
}

// Highlights dropdowns that are set to something other than their first ("All …") option.
function markSetFilters() {
  ['fOwner', 'fStatus', 'fFormat', 'fType', 'fSeen', 'fGenre', 'wKind', 'wBy', 'wSort'].forEach(function (id) {
    var el = document.getElementById(id);
    el.classList.toggle('is-set', el.value !== '');
  });
}

function applyFilters() {
  if (state.view === 'wishlist') return drawWishView();
  var shown = state.groups.filter(matches);
  var discCount = shown.reduce(function (n, g) { return n + g.discs.length; }, 0);
  document.getElementById('status').textContent = shown.length + ' of ' + state.groups.length + ' titles · ' +
    discCount + ' of ' + state.data.discs.length + ' copies' + (state.stale ? ' · updating…' : '') +
    (Object.keys(readOutbox()).length ? ' · saving ticks…' : '');
  document.getElementById('grid').innerHTML = shown.map(card).join('');
  drawResults('library');
}

// The genre categories of a title: those of every film on its discs, or "Other" without movie data.
function groupCategories(g) {
  var cats = [];
  g.items.forEach(function (i) { (i.categories || ['Other']).forEach(function (c) { if (cats.indexOf(c) < 0) cats.push(c); }); });
  return cats.length ? cats : ['Other'];
}

// The genres to offer, in the order the API gives; any it leaves out come after, alphabetically, so every title stays reachable.
// Only genres some title is in are listed.
function genreList(data) {
  var present = {};
  data.discs.forEach(function (d) {
    var items = d.meta && d.meta.items || [];
    groupCategories({ items: items }).forEach(function (c) { present[c] = true; });
  });
  var order = (data.categories || []).filter(function (c) { return c !== 'Other'; });
  order = order.concat(Object.keys(present).filter(function (c) { return c !== 'Other' && order.indexOf(c) < 0; }).sort(), ['Other']);
  return order.filter(function (c) { return present[c]; });
}

function card(g) {
  var d = g.discs[0];
  var item = g.items[0];
  var out = g.discs.some(function (x) { return x.where !== x.owner; });
  var requested = g.discs.some(function (x) { return (x.requests || []).length; });
  var poster = item && item.poster
    ? '<img loading="lazy" decoding="async" class="poster w-full object-cover" src="' + IMG + 'w185' + esc(item.poster) + '"' +
      ' srcset="' + IMG + 'w185' + esc(item.poster) + ' 185w, ' + IMG + 'w342' + esc(item.poster) + ' 342w"' +
      ' sizes="(min-width: 1024px) 16vw, (min-width: 768px) 25vw, 33vw" alt="">'
    : '<div class="poster w-full flex items-center justify-center p-3 text-center text-sm text-gray-400 bg-white/5">' + esc(d.title) + '</div>';
  return '<button class="text-left group self-start" onclick="openGroup(\'' + esc(g.key) + '\')">' +
    '<div class="relative rounded-lg overflow-hidden ring-1 ring-white/10 group-hover:ring-white/40 transition">' + poster +
      '<div class="absolute top-2 left-2 flex items-center gap-1">' + mediaIcons(g.discs) +
        (g.items.length > 1 ? '<span class="text-xs bg-black/70 rounded px-1.5 py-0.5">' + g.items.length + ' films</span>' : '') + '</div>' +
      (out ? '<span class="absolute top-2 right-2 text-xs bg-amber-500 text-black rounded px-1.5 py-0.5">lent</span>' : '') +
      (requested ? '<span class="absolute bottom-2 right-2 text-xs bg-sky-500 text-black rounded px-1.5 py-0.5">requested</span>' : '') +
      (groupSeenBy(g, state.data.user.name) ? '<span class="absolute bottom-2 left-2 text-xs bg-emerald-600 rounded px-1.5 py-0.5">✓ seen</span>' : '') +
    '</div>' +

// ---------- Seen ----------
// Each person ticks themselves and their household (kids, a partner: plain names, not app users).
// A film is keyed by its TMDB id, so a film counts as seen on every disc it is on, collections included.
// TV seasons share a TMDB id, so they, and discs without movie data, are keyed by the disc.

var HOUSEHOLD = '#household';
var SEEN_DELAY = 800;  // ticks made within this time of each other go out in one save
var SEEN_RETRY = 15000; // after a network failure, try again this much later
var SEEN_BATCH = 200;   // the most ticks the server takes in one save
var seen = { timer: null, sending: false };

function viewers() {
  return [state.data.user.name].concat(state.data.household || []);
}

function seenKey(item, g) {
  return item && item.kind === 'movie' ? 'movie:' + item.tmdbId : 'disc:' + g.discs[0].key;
}

function groupKeys(g) {
  return g.items.length ? g.items.map(function (i) { return seenKey(i, g); }) : [seenKey(null, g)];
}

function isSeen(key, person) {
  return ((state.data.seen || {})[key] || []).indexOf(person) >= 0;
}

// A collection counts as seen once every film in it is.
function groupSeenBy(g, person) {
  return groupKeys(g).every(function (k) { return isSeen(k, person); });
}

function seenRow(key, title) {
  var chips = viewers().map(function (p) {
    var on = isSeen(key, p);
    return '<button data-seen-key="' + esc(key) + '" data-person="' + esc(p) + '" data-title="' + esc(title) + '" aria-pressed="' + on + '"' +
      ' class="rounded-full px-2.5 py-0.5 text-xs ' + (on ? 'bg-emerald-600 hover:bg-emerald-500' : 'bg-white/10 hover:bg-white/20 text-gray-300') + '">' +
      (on ? '✓ ' : '') + esc(p) + '</button>';
  }).join('');
  return '<div class="flex flex-wrap items-center gap-1.5 pt-1"><span class="text-gray-400 mr-1">Seen by</span>' + chips +
    '<button class="text-xs text-gray-400 underline hover:text-gray-200 ml-1" onclick="openHousehold()">' +
      (state.data.household && state.data.household.length ? 'Edit household' : '+ Add kids or family') + '</button></div>';
}

// Ticks wait in an outbox kept in this browser until the sheet confirms them, so a reload, a closed tab or a phone
// switching apps never loses them: whatever is left is sent on the next visit. Each entry says what the mark should
// be (not "toggle"), so sending one twice is harmless. Ticks made close together go out in one save.

function readOutbox() {
  try { return JSON.parse(localStorage.getItem(OUTBOX_KEY)) || {}; } catch (e) { return {}; }
}

function writeOutbox(box) {
  try {
    if (Object.keys(box).length) localStorage.setItem(OUTBOX_KEY, JSON.stringify(box));
    else localStorage.removeItem(OUTBOX_KEY);
  } catch (e) {}
}

// Shows unsent ticks on top of what the sheet sent, so an answer to any other call doesn't hide them.
function withOutbox(data) {
  var box = readOutbox();
  data.seen = data.seen || {};
  Object.keys(box).forEach(function (k) {
    var c = box[k];
    var list = (data.seen[c.movie] || []).filter(function (p) { return p !== c.person; });
    if (c.seen) list.push(c.person);
    data.seen[c.movie] = list;
  });
  return data;
}

function toggleSeen(key, person, title) {
  var on = !isSeen(key, person);
  var box = readOutbox();
  box[key + '\n' + person] = { movie: key, title: title, person: person, seen: on };
  writeOutbox(box);
  withOutbox(state.data);
  redraw();
  clearTimeout(seen.timer);
  seen.timer = setTimeout(flushSeen, SEEN_DELAY);
}

// At most SEEN_BATCH ticks go in one save, as the server takes no more; the rest follow once it answers.
function flushSeen() {
  clearTimeout(seen.timer);
  var box = readOutbox();
  var keys = Object.keys(box).slice(0, SEEN_BATCH);
  if (seen.sending || !keys.length) return;
  seen.sending = true;
  var batch = {};
  keys.forEach(function (k) { batch[k] = box[k]; });
  var sent = JSON.stringify(batch);
  api('seen', { changes: keys.map(function (k) { return box[k]; }), reply: 'personal' }).then(function (data) {
    // Drop what the sheet now has; a tick changed again meanwhile stays for the next save.
    var now = readOutbox();
    var was = JSON.parse(sent);
    Object.keys(was).forEach(function (k) {
      if (now[k] && JSON.stringify(now[k]) === JSON.stringify(was[k])) delete now[k];
    });
    writeOutbox(now);
    seen.sending = false;
    freshPersonal(data);
    if (Object.keys(now).length) flushSeen();
  }, function (err) {
    seen.sending = false;
    if (err && err.code === 'denied') {
      writeOutbox({});
      return changeFailed(err);
    }
    // Offline, a busy sheet, or no answer: keep the ticks and try again.
    alertBox('Your ticks are not saved yet. Trying again shortly.');
    seen.timer = setTimeout(flushSeen, SEEN_RETRY);
  });
}

function redraw() {
  saveSoon();
  applyFilters();
  if (state.openKey === HOUSEHOLD) openHousehold();
  else if (state.openKey === REQUESTS) openRequests();
  else if (state.openKey && state.openKey.indexOf(WISH_PREFIX) === 0) openWish(state.openKey.slice(WISH_PREFIX.length));
  else if (state.openKey && state.openKey.indexOf(ADD_PREFIX) === 0) return; // keep what is typed into the add form
  else if (state.openKey) openGroup(state.openKey);
}

// ---------- Requests ----------
// Anyone who doesn't have a disc can request it, with an optional note. The request is for whoever has the disc,
// so the overview is a packing list for the next meeting: what to bring for whom, and what to collect from whom.

var REQUESTS = '#requests';

function requestList() {
  var me = state.data.user.name;
  var out = { toMe: [], mine: [] };
  state.data.discs.forEach(function (d) {
    (d.requests || []).forEach(function (r) {
      if (d.where === me) out.toMe.push({ d: d, r: r });
      if (r.by === me) out.mine.push({ d: d, r: r });
    });
  });
  return out;
}

// Groups rows by a person ("For Anna", "From Matthias"), people and titles in alphabetical order.
function byPerson(rows, person, heading, row) {
  var groups = {};
  rows.forEach(function (x) { (groups[person(x)] = groups[person(x)] || []).push(x); });
  return Object.keys(groups).sort().map(function (p) {
    var list = groups[p].sort(function (a, b) { return sortTitle(a.d.title).localeCompare(sortTitle(b.d.title)); });
    return '<div><h4 class="font-medium mb-1.5">' + heading + ' ' + esc(p) + ' (' + list.length + ')</h4>' +
      '<ul class="space-y-1.5">' + list.map(row).join('') + '</ul></div>';
  }).join('');
}

function requestRow(x, buttons) {

// Switches between the library and the wishlist. The choice is kept in the address, so a reload or a shared link keeps it.

  document.getElementById('tabWishlist').setAttribute('aria-pressed', onWish);
  document.getElementById('filters').hidden = onWish;
  document.getElementById('wishFilters').hidden = !onWish;
  document.getElementById('grid').classList.toggle('hidden', onWish);
  document.getElementById('libResults').classList.toggle('hidden', onWish);
  document.getElementById('wishView').classList.toggle('hidden', !onWish);

function drawWishView() {
  var all = state.data.wishlist || [];

  if (sort === 'year') shown.sort(function (a, b) { return (b.year || '0').localeCompare(a.year || '0'); });

// "movie:603" / "tv:1396" refs of everything in the library, so the wishlist can say what is already there.
function libraryRefs() {

  });

function wishedRefs() {
  var refs = {};

function wishLinks(w) {

function addWish(ref) {

// Bought it: the add form opens with "Remove it from the wishlist" ticked, so the title leaves the wishlist as it joins the library.
function moveToLibrary(ref) {

  state.data.wishlist = (state.data.wishlist || []).filter(function (w) { return w.ref !== ref; });

// ---------- Finding titles on TMDB ----------
// The library and wishlist search boxes filter their own page and, after a short pause, also search TMDB
// (or an IMDb link) for titles to add. Each page keeps its own results; answers are shared between them.

var finder = {
  library: { input: 'q', box: 'libResults', heading: 'Add to the library from TMDB', results: null, error: '', loading: false, seq: 0, timer: null },
  wishlist: { input: 'wq', box: 'addResults', heading: 'Add from TMDB', results: null, error: '', loading: false, seq: 0, timer: null },
  cache: {}, adding: {}, found: {}
};

function findQuery(view) {
  return document.getElementById(finder[view].input).value.replace(/\s+/g, ' ').trim();
}

// Searches TMDB after a short pause in typing. Answers that arrive after a newer search started are dropped.
function findTitles(view) {
  var f = finder[view];
  var q = findQuery(view);
  clearTimeout(f.timer);
  f.seq++;
  f.error = '';
  if (q.length < 2) { f.results = null; f.loading = false; return drawResults(view); }
  var key = q.toLowerCase();
  if (finder.cache[key]) { f.results = finder.cache[key]; f.loading = false; return drawResults(view); }
  f.loading = true;
  drawResults(view);
  var seq = f.seq;
  f.timer = setTimeout(function () {
    api('search', { q: q }).then(function (results) {
      finder.cache[key] = results;
      if (seq !== f.seq) return;
      f.results = results; f.loading = false;
      drawResults(view);
    }, function (err) {
      if (seq !== f.seq) return;
      f.results = null; f.error = err && err.message || String(err); f.loading = false;
      drawResults(view);
    });
  }, 350);
}

// TMDB results as a row of small posters, each with its add button.
function drawResults(view) {
  var f = finder[view];
  var box = document.getElementById(f.box);
  var heading = '<h3 class="text-sm uppercase tracking-wide text-gray-400 mb-2">' + f.heading + '</h3>';
  if (f.error) { box.innerHTML = heading + '<p class="text-sm text-amber-400">' + esc(f.error) + '</p>'; return; }
  if (f.loading && !f.results) { box.innerHTML = heading + '<p class="text-sm text-gray-400">Searching…</p>'; return; }
  if (!f.results) { box.innerHTML = ''; return; }
  if (!f.results.length) { box.innerHTML = heading + '<p class="text-sm text-gray-400">No movies or series found.</p>'; return; }
  var owned = libraryRefs();
  var wished = wishedRefs();
  box.innerHTML = heading + '<div class="flex gap-3 overflow-x-auto pb-2' + (f.loading ? ' opacity-60' : '') + '">' + f.results.map(function (r) {
    finder.found[r.ref] = r;
    var action;
    if (view === 'library') {
      action = finder.adding[r.ref] ? '<span class="text-xs text-gray-400">Adding…</span>'
        : (owned[r.ref] ? '<div class="text-xs text-emerald-400">In library</div>' : wished[r.ref] ? '<div class="text-xs text-sky-300">On wishlist</div>' : '') +
          '<button class="rounded px-2 py-1 text-xs ' + (owned[r.ref] ? 'bg-white/10 hover:bg-white/20' : 'bg-emerald-600 hover:bg-emerald-500') +
          '" onclick="openAdd(\'' + esc(r.ref) + '\')">' + (owned[r.ref] ? '+ Copy' : '+ Library') + '</button>';
    } else {
      action = owned[r.ref] ? '<span class="text-xs text-emerald-400">In library</span>'
        : wished[r.ref] ? '<span class="text-xs text-sky-300">On wishlist</span>'
        : finder.adding[r.ref] ? '<span class="text-xs text-gray-400">Adding…</span>'
        : '<button class="rounded px-2 py-1 text-xs bg-sky-600 hover:bg-sky-500" onclick="addWish(\'' + esc(r.ref) + '\')">+ Wishlist</button>';
    }
    var poster = r.poster ? '<img loading="lazy" decoding="async" class="poster w-full object-cover rounded" src="' + IMG + 'w185' + esc(r.poster) + '" alt="">'
      : '<div class="poster w-full rounded bg-white/5 flex items-center justify-center p-2 text-center text-xs text-gray-400">' + esc(r.title) + '</div>';
    return '<div class="w-24 sm:w-28 shrink-0 space-y-1" title="' + esc(r.overview) + '">' + poster +
      '<div class="text-xs font-medium leading-tight line-clamp-2">' + esc(r.title) + '</div>' +
      '<div class="text-[11px] text-gray-400">' + esc([r.year, r.kind === 'tv' ? 'Series' : 'Movie'].filter(Boolean).join(' · ')) + '</div>' +
      action + '</div>';
  }).join('') + '</div>';
}

// ---------- Adding discs ----------
// A title found on TMDB becomes a new row in the sheet, owned by the person adding it. The form asks for what the
// sheet row needs beyond the title: the disc formats, a season for a series, and an optional note.

var ADD_PREFIX = 'add:';
var FORMATS = ['HD Blu Ray', '4k Blu Ray', '3D Blu Ray'];
var SOURCES = ['Netflix', 'Amazon Prime Video', 'Apple TV', 'Disney+', 'Google Play / YouTube', 'Sky / WOW', 'Rakuten TV', 'Paramount+'];
// Where each source searches for a title; any other source searches JustWatch, which links on to the platform.
var SOURCE_SEARCH = {
  'Netflix': 'https://www.netflix.com/search?q=',
  'Amazon Prime Video': 'https://www.primevideo.com/search?phrase=',
  'Apple TV': 'https://tv.apple.com/search?term=',
  'Disney+': 'https://www.disneyplus.com/search?q=',
  'Google Play / YouTube': 'https://play.google.com/store/search?c=movies&q='
};
var JUSTWATCH_SEARCH = 'https://www.justwatch.com/de/Suche?q=';
// How TMDB names each source's services, to tell whether a source offers the title.
var SOURCE_PROVIDERS = {
  'Netflix': /^netflix/i, 'Amazon Prime Video': /^amazon/i, 'Apple TV': /^apple/i, 'Disney+': /^disney/i,
  'Google Play / YouTube': /google play|youtube/i, 'Sky / WOW': /^(sky|wow)\b/i, 'Rakuten TV': /rakuten/i, 'Paramount+': /^paramount/i
};

function openAdd(ref) {
  var r = finder.found[ref];
  if (!r) return;
  state.openKey = ADD_PREFIX + ref;
  var copies = state.data.discs.filter(function (d) {
    return (d.meta && d.meta.items || []).some(function (i) { return i.kind + ':' + i.tmdbId === ref; });
  });
  var wished = wishedRefs()[ref];
  var field = 'bg-white/5 rounded px-3 py-1.5 outline-none focus:ring-1 ring-white/30';
  document.getElementById('detail').innerHTML =
    '<form class="p-5 space-y-4 text-sm" onsubmit="addDisc(event, \'' + esc(ref) + '\')">' +
      '<div class="flex items-start gap-4">' +
        (r.poster ? '<img decoding="async" class="w-20 sm:w-28 rounded self-start" src="' + IMG + 'w185' + esc(r.poster) + '" alt="">' : '') +
        '<div class="space-y-1 min-w-0 mr-auto">' +
          '<div class="text-xs uppercase tracking-wide text-gray-400">Add to the library</div>' +
          '<h2 class="text-2xl font-semibold">' + esc(r.title) + '</h2>' +
          '<div class="text-gray-400">' + esc([r.year, r.kind === 'tv' ? 'Series' : 'Movie'].filter(Boolean).join(' · ')) + '</div>' +
          (copies.length ? '<div class="text-emerald-400">Already in the library: ' + esc(copies.map(function (d) {
            return d.title + ' (' + (d.digital ? 'Digital' : formatBadges([d])) + ', ' + d.owner + ')';
          }).join('; ')) + '</div>' : '') +
        '</div>' +
        '<button type="button" onclick="closeModal()" class="bg-white/10 rounded-full w-8 h-8 shrink-0">✕</button>' +
      '</div>' +
      '<fieldset><legend class="text-gray-400 mb-1.5">I own it</legend><div class="flex flex-wrap gap-2">' +
        '<label class="flex items-center gap-1.5 bg-white/5 rounded px-3 py-1.5 cursor-pointer"><input type="radio" name="medium" value="disc" checked onchange="pickMedium()"> ' + DISC_ICON + ' On disc</label>' +
        '<label class="flex items-center gap-1.5 bg-white/5 rounded px-3 py-1.5 cursor-pointer"><input type="radio" name="medium" value="digital" onchange="pickMedium()"> ' + CLOUD_ICON + ' Digitally</label>' +
      '</div></fieldset>' +
      '<fieldset id="addFormats"><legend class="text-gray-400 mb-1.5">Format</legend><div class="flex flex-wrap gap-2">' + FORMATS.map(function (f, i) {
        return '<label class="flex items-center gap-1.5 bg-white/5 rounded px-3 py-1.5 cursor-pointer">' +
          '<input type="checkbox" name="format" value="' + esc(f) + '"' + (i === 0 ? ' checked' : '') + '> ' + esc(f.replace('4k', '4K')) + '</label>';
      }).join('') + '</div></fieldset>' +
      '<fieldset id="addSources" hidden><legend class="text-gray-400 mb-1.5">Source</legend><div class="flex flex-wrap gap-2">' + SOURCES.map(function (f) {
        return '<label class="flex items-center gap-1.5 bg-white/5 rounded px-3 py-1.5 cursor-pointer">' +
          '<input type="checkbox" name="source" value="' + esc(f) + '"> ' + esc(f) + '</label>';
      }).join('') +
        '<input id="addOther" maxlength="40" placeholder="Other, e.g. Maxdome" class="w-44 ' + field + '">' +
      '</div><label class="block mt-3"><span class="block text-gray-400 mb-1.5">Streaming link (optional)</span>' +
        '<input id="addLink" type="url" maxlength="500" placeholder="https://… copied from the platform" class="w-full ' + field + '">' +
        '<span class="block text-xs text-gray-400 mt-1">Without one, each source opens that platform\'s search for the title.</span></label><span class="block text-xs text-gray-400 mt-1">Digital titles are only shown to you, since they can\'t be lent.</span></fieldset>' +
      (r.kind === 'tv' ? '<label class="block"><span class="block text-gray-400 mb-1.5">Season</span>' +
        '<input id="addSeason" type="number" min="1" max="99" inputmode="numeric" placeholder="e.g. 1" class="w-28 ' + field + '">' +
        '<span class="block text-xs text-gray-400 mt-1">Leave empty for a box set of the whole series.</span></label>' : '') +
      '<label class="block"><span class="block text-gray-400 mb-1.5">Note (optional)</span>' +
        '<input id="addNotes" maxlength="200" placeholder="e.g. Steelbook, UK release" class="w-full ' + field + '"></label>' +
      (wished ? '<label class="flex items-center gap-2"><input id="addUnwish" type="checkbox" checked> Remove it from the wishlist (added by ' + esc(wished.by) + ')</label>' : '') +
      '<p id="addWhose" class="text-gray-400">It is added as your disc, ' + esc(state.data.user.name) + ', and at your place. You can edit the row in the sheet any time.</p>' +
      '<p id="addError" class="hidden text-amber-400"></p>' +
      '<div class="flex justify-end gap-2">' +
        '<button type="button" onclick="closeModal()" class="rounded px-4 py-1.5 bg-white/10 hover:bg-white/20">Cancel</button>' +
        '<button class="rounded px-4 py-1.5 bg-emerald-600 hover:bg-emerald-500">Add to library</button>' +
      '</div>' +
    '</form>';
  document.getElementById('modal').classList.remove('hidden');
}

// Disc or digital: the form shows formats for a disc and sources for a digital title.
function pickMedium() {
  var digital = document.querySelector('#detail input[name=medium]:checked').value === 'digital';
  document.getElementById('addFormats').hidden = digital;
  document.getElementById('addSources').hidden = !digital;
  document.getElementById('addWhose').textContent = digital
    ? 'It is added as your digital copy, ' + state.data.user.name + '. You can edit the row in the sheet any time.'
    : 'It is added as your disc, ' + state.data.user.name + ', and at your place. You can edit the row in the sheet any time.';
  document.getElementById('addNotes').placeholder = digital ? 'e.g. 4K with Dolby Vision' : 'e.g. Steelbook, UK release';
  document.getElementById('addError').classList.add('hidden');
}

function addDisc(e, ref) {
  e.preventDefault();
  var form = e.target;
  var ticked = function (name) {
    return Array.prototype.filter.call(form.querySelectorAll('input[name=' + name + ']'), function (x) { return x.checked; }).map(function (x) { return x.value; });
  };
  var digital = form.querySelector('input[name=medium]:checked').value === 'digital';
  var formats = ticked('format');
  var sources = ticked('source');
  var other = document.getElementById('addOther').value.trim();
  var link = document.getElementById('addLink').value.trim();
  var problem = digital ? (!sources.length && !other && 'Pick at least one source.') || (link && !isLink(link) && 'The streaming link must start with https://') : (!formats.length && 'Pick at least one format.');
  if (problem) {
    var err = document.getElementById('addError');
    err.textContent = problem;
    err.classList.remove('hidden');
    return;
  }
  var season = document.getElementById('addSeason');
  var unwish = document.getElementById('addUnwish');
  var title = finder.found[ref].title;
  var params = { ref: ref, season: season ? season.value : '', notes: document.getElementById('addNotes').value, unwish: !!(unwish && unwish.checked) };
  if (digital) { params.digital = true; params.sources = sources; params.other = other; params.link = link; } else params.formats = formats;
  closeModal();
  finder.adding[ref] = true;
  drawResults('library');
  busy();
  api('addDisc', params).then(function (data) {
    delete finder.adding[ref];
    fresh(data);
    alertBox(title + ' is in the library now.');
  }, function (err) { delete finder.adding[ref]; changeFailed(err); });
}

// ---------- Household ----------

function openHousehold() {
  if (state.openKey !== HOUSEHOLD) state.backKey = state.openKey;
  state.openKey = HOUSEHOLD;
  var names = state.data.household || [];
  var list = names.length ? names.map(function (n, i) {
    return '<li class="flex items-center justify-between bg-white/5 rounded px-3 py-2"><span>' + esc(n) + '</span>' +
      '<button class="text-xs text-gray-400 underline hover:text-gray-200" onclick="removeMember(' + i + ')">Remove</button></li>';
  }).join('') : '<li class="text-gray-400">Nobody yet.</li>';
  document.getElementById('detail').innerHTML =
    '<div class="p-5 space-y-4 text-sm">' +
      '<div class="flex items-center"><h2 class="text-xl font-semibold mr-auto">Your household</h2>' +
        '<button onclick="closeHousehold()" class="bg-white/10 rounded-full w-8 h-8">✕</button></div>' +
      '<p class="text-gray-400">Add the people you watch with, like your kids. They don\'t need an account: ' +
        'you tick them on a movie to mark that they have seen it. Only you see your household and its ticks.</p>' +
      '<ul class="space-y-1.5">' + list + '</ul>' +
      '<form class="flex gap-2" onsubmit="addMember(event)">' +
        '<input id="newMember" maxlength="40" placeholder="Name, e.g. Mia" class="flex-1 bg-white/5 rounded px-3 py-1.5 outline-none focus:ring-1 ring-white/30">' +
        '<button class="bg-white/10 hover:bg-white/20 rounded px-3 py-1.5">Add</button></form>' +
      '<div class="text-right"><button onclick="closeHousehold()" class="bg-emerald-600 hover:bg-emerald-500 rounded px-4 py-1.5">Done</button></div>' +
    '</div>';
  document.getElementById('modal').classList.remove('hidden');
}

function closeHousehold() {
  var back = state.backKey;
  state.backKey = null;
  if (back) openGroup(back); else closeModal();
}

function addMember(e) {
  e.preventDefault();
  var name = document.getElementById('newMember').value.replace(/\s+/g, ' ').trim();
  if (!name) return;
  saveHousehold((state.data.household || []).concat([name]));
}

function removeMember(i) {
  var names = (state.data.household || []).slice();
  names.splice(i, 1);
  saveHousehold(names);
}

function saveHousehold(names) {
  state.data.household = names;
  redraw();
  busy();
  api('household', { names: names }).then(fresh, changeFailed);
}

// The trailer TMDB lists, or a YouTube search when it lists none.
function trailerUrl(i) {
  if (i.trailer) return 'https://www.youtube.com/watch?v=' + encodeURIComponent(i.trailer);
  return 'https://www.youtube.com/results?search_query=' + encodeURIComponent(i.title + ' ' + (i.year || '') + ' trailer');
}

function copyBlock(d) {
  var me = state.data.user.name;
  if (d.digital) return digitalBlock(d);
  var canAct = me === d.owner || me === d.where;
  var others = state.data.people.filter(function (p) { return p !== d.where; });
  var reqs = d.requests || [];
  var mine = reqs.filter(function (r) { return r.by === me; })[0];
  var actions = '';
  if (canAct) {
    // The lend list starts at whoever asked first.
    var first = reqs.length ? reqs[0].by : '';
    actions = '<div class="flex flex-wrap gap-2 mt-2">' +
      '<select id="to-' + esc(d.key) + '" class="bg-white/5 rounded px-2 py-1 text-sm">' +
        others.map(function (p) { return '<option' + (p === first ? ' selected' : '') + '>' + esc(p) + '</option>'; }).join('') + '</select>' +
      '<button class="bg-white/10 hover:bg-white/20 rounded px-3 py-1 text-sm" onclick="lend(\'' + esc(d.key) + '\')">Lend</button>' +
      (d.where !== d.owner ? '<button class="bg-emerald-600 hover:bg-emerald-500 rounded px-3 py-1 text-sm" onclick="giveBack(\'' + esc(d.key) + '\')">Mark returned</button>' : '') +
    '</div>';
  }
  // Removing takes two clicks: the button only asks, and the disc goes once the question is answered with yes.
  if (me === d.owner && d.where === d.owner) {
    actions += state.removing === d.key
      ? '<div class="mt-2 rounded border border-red-500/40 bg-red-500/10 p-2 space-y-2">' +
          '<div>Remove ' + esc(d.title) + ' (' + esc(formatBadges([d])) + ') from the library? Its row is deleted from the sheet' +
          (reqs.length ? ' and the open requests for it are closed' : '') + '.</div>' +
          '<div class="flex flex-wrap gap-2">' +
            '<button class="bg-white/10 hover:bg-white/20 rounded px-3 py-1 text-sm" onclick="askRemove(null)">Keep it</button>' +
            '<button class="bg-red-600 hover:bg-red-500 rounded px-3 py-1 text-sm" onclick="removeDisc(\'' + esc(d.key) + '\')">Yes, remove it</button>' +
          '</div></div>'
      : '<div class="mt-2"><button class="text-red-300 hover:text-red-200 text-xs underline" onclick="askRemove(\'' + esc(d.key) + '\')">Remove from library…</button></div>';
  }
  if (me !== d.where) {
    actions += mine
      ? '<div class="flex flex-wrap items-center gap-2 mt-2 text-sky-300">You asked for this disc' + (mine.note ? ' (“' + esc(mine.note) + '”)' : '') + '.' +
        '<button class="bg-white/10 hover:bg-white/20 text-gray-100 rounded px-3 py-1 text-sm" onclick="closeRequest(\'' + esc(mine.id) + '\', \'cancel\')">Cancel request</button></div>'
      : '<div class="flex flex-wrap gap-2 mt-2">' +
        '<input id="note-' + esc(d.key) + '" maxlength="200" placeholder="Note, e.g. for Saturday (optional)" class="flex-1 min-w-0 bg-white/5 rounded px-2 py-1 text-sm outline-none focus:ring-1 ring-white/30">' +
        '<button class="bg-sky-600 hover:bg-sky-500 rounded px-3 py-1 text-sm" onclick="requestDisc(\'' + esc(d.key) + '\')">' + (me === d.owner ? 'Ask for it back' : 'Request') + '</button></div>';
  }
  var requested = reqs.length ? '<div class="text-sky-300">Requested by ' + reqs.map(function (r) {
    return esc(r.by) + (r.note ? ' (“' + esc(r.note) + '”)' : '');
  }).join(', ') + '</div>' : '';
  var history = d.history.length ? '<details class="mt-2 text-xs text-gray-400"><summary class="cursor-pointer">History (' + d.history.length + ')</summary>' +
    d.history.slice().reverse().map(function (h) {
      return '<div>' + esc(new Date(h.at).toLocaleDateString()) + ': ' + esc(h.from) + ' → ' + esc(h.to) + (h.note ? ' (' + esc(h.note) + ')' : '') + '</div>';
    }).join('') + '</details>' : '';
  return '<div class="rounded-lg bg-white/5 p-3 mb-2 text-sm">' +
    '<div><span class="font-medium">' + esc(d.formats.join(', ')) + '</span>' + (d.notes && d.type.indexOf('collection') < 0 ? ' · ' + esc(d.notes) : '') + '</div>' +
    '<div class="text-gray-400">Owner: ' + esc(d.owner) + ' · Currently at: <span class="' + (d.where !== d.owner ? 'text-amber-400' : '') + '">' + esc(d.where) + '</span></div>' +
    requested + actions + history + '</div>';
}

// A digital title only ever reaches its owner: no lending, no requests, just its sources and the remove step.
function digitalBlock(d) {
  var remove = state.removing === d.key
    ? '<div class="mt-2 rounded border border-red-500/40 bg-red-500/10 p-2 space-y-2">' +
        '<div>Remove ' + esc(d.title) + ' (Digital) from the library? Its row is deleted from the sheet.</div>' +
        '<div class="flex flex-wrap gap-2">' +
          '<button class="bg-white/10 hover:bg-white/20 rounded px-3 py-1 text-sm" onclick="askRemove(null)">Keep it</button>' +
          '<button class="bg-red-600 hover:bg-red-500 rounded px-3 py-1 text-sm" onclick="removeDisc(\'' + esc(d.key) + '\')">Yes, remove it</button>' +
        '</div></div>'
    : '<div class="mt-2"><button class="text-red-300 hover:text-red-200 text-xs underline" onclick="askRemove(\'' + esc(d.key) + '\')">Remove from library…</button></div>';
  var a = 'class="text-sky-300 hover:text-sky-200 underline" target="_blank" rel="noopener noreferrer"';
  // Your own link opens the title itself; without one, each source opens its platform's search for the title.
  // A tick means TMDB lists the title on that source in Germany right now.
  var watch = watchInfo(d);
  findLink(d);
  var sources = (d.sources || []).map(function (s) {
    var tick = watch && offers(watch.providers, s) ? ' <span class="text-emerald-400" title="Available there according to TMDB">✓</span>' : '';
    return (d.link ? esc(s) : '<a ' + a + ' href="' + esc(sourceSearch(s, d.title)) + '">' + esc(s) + '</a>') + tick;
  }).join(', ');
  var link = state.editingLink === d.key
    ? '<form class="mt-2 flex flex-wrap gap-2" onsubmit="saveLink(event, \'' + esc(d.key) + '\')">' +
        '<input id="linkInput" type="url" maxlength="500" value="' + esc(d.link || '') + '" placeholder="https://… copied from the platform" class="flex-1 min-w-0 bg-white/5 rounded px-3 py-1 outline-none focus:ring-1 ring-white/30">' +
        '<button type="button" class="bg-white/10 hover:bg-white/20 rounded px-3 py-1 text-sm" onclick="editLink(null)">Cancel</button>' +
        '<button class="bg-emerald-600 hover:bg-emerald-500 rounded px-3 py-1 text-sm">Save</button>' +
      '</form>'
    : '<div class="mt-1 flex flex-wrap items-center gap-3">' +
        (d.link ? '<a ' + a.replace('underline', 'font-medium') + ' href="' + esc(d.link) + '">▶ Watch now</a>' : '') +
        (watch && watch.link ? '<a ' + a.replace('text-sky-300', 'text-gray-400') + ' href="' + esc(watch.link) + '">Where to watch (TMDB)</a>' : '') +
        '<button class="text-gray-400 hover:text-gray-200 text-xs underline" onclick="editLink(\'' + esc(d.key) + '\')">' + (d.link ? 'Change streaming link…' : 'Add a streaming link…') + '</button>' +
      '</div>';
  return '<div class="rounded-lg bg-white/5 p-3 mb-2 text-sm">' +
    '<div class="flex items-center gap-1.5 flex-wrap"><span class="text-sky-300">' + CLOUD_ICON + '</span><span class="font-medium">Digital</span>' +
      (sources ? ' · ' + sources : '') + (d.notes && d.type.indexOf('collection') < 0 ? ' · ' + esc(d.notes) : '') + '</div>' +
    '<div class="text-gray-400">Owner: ' + esc(d.owner) + ' · Only you can see this copy, since it can\'t be lent.</div>' +
    link + remove + '</div>';
}

// Where TMDB says the title streams, asked once per title when its details first open.
function watchInfo(d) {
  var i = d.meta && d.meta.items && d.meta.items[0];
  if (!i) return null;
  var ref = i.kind + ':' + i.tmdbId;
  state.watch = state.watch || {};
  if (!(ref in state.watch)) {
    state.watch[ref] = null;
    var open = state.openKey;
    api('watch', { ref: ref }).then(function (w) {
      state.watch[ref] = w;
      if (open && state.openKey === open && !state.editingLink) openGroup(open);
    }, function () {});
  }
  return state.watch[ref];
}

// A digital title without a link gets one looked up once (saved in the sheet when found).
function findLink(d) {
  state.linkTried = state.linkTried || {};
  if (d.link || state.linkTried[d.key]) return;
  state.linkTried[d.key] = true;
  var open = state.openKey;
  api('findLink', { key: d.key }).then(function (r) {
    if (!r.link || d.link) return;
    d.link = r.link;
    if (open && state.openKey === open && !state.editingLink) openGroup(open);
  }, function () {});
}

function offers(providers, source) {
  var re = SOURCE_PROVIDERS[source];
  return providers.some(function (p) { return re ? re.test(p) : p.toLowerCase() === source.toLowerCase(); });
}

function sourceSearch(source, title) {
  return (SOURCE_SEARCH[source] || JUSTWATCH_SEARCH) + encodeURIComponent(title.replace(/ – Season \d+$/, ''));
}

function isLink(url) { return /^https?:\/\/[^\s/?#]+\.[^\s]*$/i.test(url); }

function editLink(key) {
  state.editingLink = key;
  if (state.openKey) openGroup(state.openKey);
  var input = document.getElementById('linkInput');
  if (input) input.focus();
}

function saveLink(e, key) {
  e.preventDefault();
  var link = document.getElementById('linkInput').value.trim();
  if (link && !isLink(link)) { alertBox('The streaming link must start with https://'); return; }
  state.editingLink = null;
  busy();
  api('setLink', { key: key, link: link }).then(fresh, changeFailed);
}

function lend(key) {
  lendTo(key, document.getElementById('to-' + key).value);
}

function lendTo(key, to) {
  busy();
  api('lend', { key: key, to: to, seenWhere: discByKey(key).where }).then(fresh, changeFailed);
}

function giveBack(key) {
  busy();
  api('return', { key: key, seenWhere: discByKey(key).where }).then(fresh, changeFailed);
}

function askRemove(key) {
  state.removing = key;
  if (state.openKey) openGroup(state.openKey);
}

function removeDisc(key) {
  var d = discByKey(key);
  closeModal();
  busy();
  api('removeDisc', { key: key, seenWhere: d.where }).then(function (data) {
    fresh(data);
    alertBox(d.title + ' was removed from the library.');
  }, changeFailed);
}

function discByKey(key) {
  return state.data.discs.filter(function (d) { return d.key === key; })[0];
}

function busy() { document.getElementById('status').textContent = 'Saving…'; }

function closeModal() {
  state.openKey = null;
  state.removing = null;
  state.editingLink = null;
  state.backKey = null;
  document.getElementById('modal').classList.add('hidden');
}

// Dropdowns redraw at once; the search boxes redraw after a short pause in typing.
function filterSoon() {
  clearTimeout(timers.filter);
  timers.filter = setTimeout(applyFilters, FILTER_DELAY);
}
['fOwner', 'fStatus', 'fFormat', 'fType', 'fSeen', 'fGenre', 'wKind', 'wBy', 'wSort'].forEach(function (id) {
  document.getElementById(id).addEventListener('input', applyFilters);
  document.getElementById(id).addEventListener('input', markSetFilters);
});
['q', 'wq'].forEach(function (id) {
  document.getElementById(id).addEventListener('input', filterSoon);
});
document.getElementById('q').addEventListener('input', function () { findTitles('library'); });
document.getElementById('wq').addEventListener('input', function () { findTitles('wishlist'); });
// The ✕ in a search box empties it, as if the text had been deleted by hand.
document.querySelectorAll('[data-clear]').forEach(function (b) {
  var input = document.getElementById(b.dataset.clear);
  var sync = function () { b.hidden = !input.value; };
  input.addEventListener('input', sync);
  b.addEventListener('click', function () {
    input.value = '';
    input.dispatchEvent(new Event('input'));
    input.focus();
  });
  sync();
});
document.getElementById('detail').addEventListener('click', function (e) {
  var b = e.target.closest('[data-seen-key]');
  if (b) toggleSeen(b.dataset.seenKey, b.dataset.person, b.dataset.title);
});
// Send waiting ticks straight away when the page is hidden or closed, rather than on the next visit.
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') { flushSeen(); saveNow(); } });
window.addEventListener('pagehide', function () { flushSeen(); saveNow(); });
window.addEventListener('online', flushSeen);
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });
load();
</script>
